<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuizParty — Join a game</title>
<meta name="description" content="Join a QuizParty game with your game PIN.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Public, relay-only player entry point. This is deliberately a separate,
     minimal page (not the full index.html SPA): it loads only what a
     player's phone needs (no editor, no host/library code, no PeerJS), so
     it works over plain HTTPS from any static host (GitHub Pages) and
     joins games solely through the Cloudflare relay (see relay/) — never a
     LAN address, never localhost. The Windows desktop host embeds this
     same URL (js/transport/config.js's publicPlayerBaseUrl) in its QR
     codes. -->

<section id="view-play" class="view active dark-bg">

  <div id="play-join" class="psub">
    <div class="center-box">
      <h1 class="logo sm">Quiz<span>Party!</span></h1>
      <div class="card join-card">
        <input id="p-pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Game PIN" autocomplete="off">
        <input id="p-name" type="text" maxlength="20" placeholder="Nickname" autocomplete="off">
        <button id="p-join" class="btn dark big full">Join!</button>
        <p id="p-join-err" class="err"></p>
      </div>
    </div>
  </div>

  <div id="play-wait" class="psub">
    <div class="center-box">
      <h2 class="on-dark">You're in, <span id="pw-name"></span>! 🎉</h2>
      <p class="on-dark muted">See your name on the big screen? Waiting for the host to start…</p>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="play-question" class="psub">
    <div class="p-qhead">
      <span id="pq-progress"></span>
      <span class="p-timer" id="pq-timer"></span>
    </div>
    <div id="pq-body"></div>
  </div>

  <div id="play-reconnecting" class="psub">
    <div class="center-box">
      <h2 class="on-dark">Reconnecting…</h2>
      <p class="on-dark muted">Hang tight, your score is safe.</p>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="play-answered" class="psub">
    <div class="center-box">
      <h2 class="on-dark">Answer locked in! 🔒</h2>
      <p class="on-dark muted">Was it the right one…?</p>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="play-result" class="psub">
    <div class="center-box">
      <div id="pr-box" class="result-box">
        <h1 id="pr-verdict"></h1>
        <p id="pr-points" class="pr-points"></p>
        <p id="pr-streak" class="pr-streak"></p>
        <p id="pr-rank" class="on-dark"></p>
      </div>
    </div>
  </div>

  <div id="play-end" class="psub">
    <div class="center-box">
      <h1 class="on-dark" id="pe-medal"></h1>
      <h2 class="on-dark" id="pe-rank"></h2>
      <p class="on-dark muted" id="pe-score"></p>
      <button class="btn big" id="pe-home">Play again</button>
    </div>
  </div>

  <div id="play-dropped" class="psub">
    <div class="center-box card">
      <h2>Connection lost</h2>
      <p id="pd-msg" class="muted">The host ended the game or the connection dropped.</p>
      <button id="pd-retry" class="btn primary">Try again</button>
      <button class="btn" id="pd-home">Home</button>
    </div>
  </div>
</section>

<script>
  // This page only ever joins through the relay — never LAN/localhost.
  window.QUIZPARTY_TRANSPORT = 'ws';
  // ?relay=... lets a self-hosted deployment (or a local test) point this
  // page at a different relay without editing js/transport/config.js;
  // production users never need this — the default relay URL there is
  // used as-is.
  const __relayOverride = new URLSearchParams(location.search).get('relay');
  if (__relayOverride) window.QUIZPARTY_RELAY_URL = __relayOverride;
</script>
<script src="js/transport/config.js"></script>
<script src="js/transport/ws-transport.js"></script>
<script src="js/transport/index.js"></script>
<script src="js/util.js"></script>
<script src="js/qtypes.js"></script>
<script src="js/player.js"></script>
<script>
  // player.js calls setCleanup() (normally provided by js/app.js's router,
  // which this single-purpose page doesn't load) to register its teardown
  // before switching sub-views; there's only ever one "route" here.
  let routeCleanup = null;
  function setCleanup(fn) { routeCleanup = fn; }

  function goHome() { if (routeCleanup) { try { routeCleanup(); } catch (e) {} routeCleanup = null; } playerShowJoinForm(); }
  document.addEventListener('DOMContentLoaded', () => {
    initPlayerEvents();
    $('#pe-home').addEventListener('click', goHome);
    $('#pd-home').addEventListener('click', goHome);
    const readHash = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      playerShowJoinForm(h.startsWith('join') ? (h.split('/')[1] || '') : '');
    };
    window.addEventListener('hashchange', readHash);
    readHash();
  });
</script>
</body>
</html>
