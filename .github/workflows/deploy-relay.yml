name: Deploy relay to Cloudflare

# Manual only — this never runs on push, so it costs nothing and changes
# nothing unless someone with repo write access explicitly clicks "Run
# workflow". It exists because the relay (relay/) must be deployed from
# somewhere with real outbound internet access to Cloudflare's API, which
# the sandboxed dev container this was built in does not have.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # set -o pipefail: without it, `tee`'s own success exit code masks
        # a failing `wrangler deploy`, so this step would report green even
        # when the deploy itself failed (as it did the first time, with the
        # error hidden behind an unrelated path bug in the next step).
        run: set -o pipefail; npx wrangler deploy | tee deploy-output.txt

      - name: Report the deployed URL
        run: |
          echo "## Relay deployed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy-output.txt >> "$GITHUB_STEP_SUMMARY" || cat deploy-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Copy that URL into js/transport/config.js's QUIZPARTY_DEFAULT_RELAY_URL and desktop/preload.js's RELAY_URL, then rebuild the Windows installer." >> "$GITHUB_STEP_SUMMARY"
