name = "quizparty-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# One Durable Object instance per 6-digit game PIN (see src/room.js). It
# holds one host WebSocket + many player WebSockets in memory for the
# lifetime of a single game and is never a quiz server: no quiz content,
# scores, or player answers are stored beyond the instant it takes to
# forward a message. See README.md for local dev and deploy steps.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]
